<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Application Received</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; text-align: center; color: #1e293b; }
    header { font-weight: bold; color: #64748b; font-size: 0.875rem; margin-bottom: 24px; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 40px 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { color: #0f172a; margin-bottom: 12px; font-size: 1.75rem; }
    .code { font-family: monospace; font-size: 2.25rem; font-weight: 800; color: #16a34a; background: #dcfce7; padding: 12px 24px; border-radius: 8px; display: inline-block; margin: 24px 0; letter-spacing: 0.1em; }
    .demo-notice { color: #64748b; font-size: 0.95rem; margin-top: 20px; font-weight: 500; }
  </style>
</head>
<body>
  <header>DEMO PORTAL</header>
  <div class="card">
    <h1>Application received</h1>
    <p>Your application has been successfully submitted and confirmed.</p>
    <div class="code">{{ confirmation_code }}</div>
    <p class="demo-notice">This is a demo portal</p>
  </div>
</body>
</html>
