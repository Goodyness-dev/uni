<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portal Error</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; text-align: center; color: #1e293b; }
    header { font-weight: bold; color: #64748b; font-size: 0.875rem; margin-bottom: 24px; }
    .card { background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 40px 24px; }
    h1 { color: #dc2626; margin-bottom: 12px; font-size: 1.75rem; }
    p { color: #475569; font-size: 1.05rem; }
  </style>
</head>
<body>
  <header>DEMO PORTAL</header>
  <div class="card">
    <h1>{{ error_title or "Error" }}</h1>
    <p>{{ message or "The requested resource could not be found." }}</p>
  </div>
</body>
</html>
