<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apply - {{ listing.name }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #1e293b; }
    header { border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 24px; font-weight: bold; color: #64748b; font-size: 0.875rem; }
    h1 { font-size: 1.875rem; margin-bottom: 8px; color: #0f172a; }
    .sub { color: #64748b; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    input[type="text"], input[type="email"], textarea { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    textarea { min-height: 120px; }
    #captcha_challenge { background: #fef3c7; border: 1px solid #f59e0b; padding: 16px; border-radius: 8px; margin: 24px 0; }
    button { background: #2563eb; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #msg { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <header>DEMO PORTAL</header>
  <h1>{{ listing.name }}</h1>
  <p class="sub">Official Application Portal (Demonstration)</p>

  <form id="applyForm">
    <div class="form-group">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" required />
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required />
    </div>

    <div class="form-group">
      <label for="summary">Candidate Summary</label>
      <textarea id="summary" name="summary"></textarea>
    </div>

    <div class="form-group">
      <label for="essay">Statement / Essay</label>
      <textarea id="essay" name="essay"></textarea>
    </div>

    <div class="form-group">
      <label for="cv_file">Curriculum Vitae (PDF)</label>
      <input type="file" id="cv_file" name="cv_file" />
    </div>

    {% if challenge_active %}
    <div id="captcha_challenge">
      <label for="captcha_answer">Security Verification: What is 7 plus 5?</label>
      <input type="text" id="captcha_answer" name="captcha_answer" placeholder="Enter number..." />
    </div>
    {% endif %}

    <button type="button" onclick="handleDirectSubmit()">Submit Application</button>
    <div id="msg"></div>
  </form>

  <script>
    async function handleDirectSubmit() {
      const msg = document.getElementById('msg');
      msg.innerText = "Submitting...";
      msg.style.color = "#475569";
      
      const payload = {
        listing_id: "{{ listing.id }}",
        idempotency_key: "manual_" + Date.now(),
        fields: {
          full_name: document.getElementById('full_name').value,
          email: document.getElementById('email').value,
          summary: document.getElementById('summary').value,
          essay: document.getElementById('essay').value
        }
      };

      try {
        const dRes = await fetch('/portal/api/draft', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const dData = await dRes.json();
        
        let captchaAns = "";
        const cElem = document.getElementById('captcha_answer');
        if (cElem) captchaAns = cElem.value;

        const sRes = await fetch('/portal/api/submit', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            draft_id: dData.draft_id,
            captcha_answer: captchaAns
          })
        });

        if (sRes.status === 200) {
          const sData = await sRes.json();
          window.location.href = '/portal/confirm/' + sData.confirmation_code;
        } else if (sRes.status === 403) {
          msg.innerText = "Security verification failed. Please solve the challenge correctly.";
          msg.style.color = "#dc2626";
        } else {
          msg.innerText = "Submission error (" + sRes.status + "). Please try again.";
          msg.style.color = "#dc2626";
        }
      } catch (err) {
        msg.innerText = "Network error: " + err;
        msg.style.color = "#dc2626";
      }
    }
  </script>
</body>
</html>
