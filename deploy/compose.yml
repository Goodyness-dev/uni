services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarpilot -d scholarpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command: ["sh", "-c", 'exec redis-server --appendonly yes --bind 127.0.0.1 --requirepass "$$REDIS_PASSWORD"']
    volumes: ["redis_data:/data"]
  api:
    build: ..
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command: ["sh", "-c", "python -m alembic upgrade head && python -m uvicorn app.main:app --host 127.0.0.1 --port 8001"]
    volumes: ["../storage:/app/storage"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ..
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    volumes: ["../storage:/app/storage"]
    depends_on:
      api: {condition: service_healthy}
  portal:
    build: ..
    restart: unless-stopped
    network_mode: host
    env_file: .env
    working_dir: /app/backend
    environment:
      PYTHONPATH: /app/backend:/opt/python
      TEST_DB_PATH: /app/storage/portal/app.db
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    volumes: ["../storage:/app/storage"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build: ../frontend
    restart: unless-stopped
    network_mode: host
    environment:
      API_BACKEND_URL: http://127.0.0.1:8001
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
